<!DOCTYPE html>
<html>
<head>
    <title>Expense Tracker</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        h1 {
            text-align: center;
        }

        .total {
            text-align: center;
            font-size: 24px;
            margin: 20px;
        }

        form {
            display: grid;
            gap: 10px;
            margin-bottom: 30px;
        }

        input, select, button {
            padding: 10px;
            font-size: 16px;
        }

        button {
            background: #333;
            color: white;
            border: none;
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        .delete {
            color: red;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>💰 Expense Tracker</h1>

    <div class="total">
        Total Expenses: ₹{{ "%.2f"|format(total) }}
    </div>

    <h2>Add Expense</h2>

    <form action="/add" method="POST">

        <input type="text" name="title"
               placeholder="Expense name" required>

        <input type="number" name="amount"
               placeholder="Amount" step="0.01" required>

        <select name="category" required>
            <option value="">Select Category</option>
            <option value="Food">Food</option>
            <option value="Travel">Travel</option>
            <option value="Shopping">Shopping</option>
            <option value="Education">Education</option>
            <option value="Other">Other</option>
        </select>

        <input type="date" name="date" required>

        <button type="submit">Add Expense</button>

    </form>

    <h2>Expense History</h2>

    <table>
        <tr>
            <th>Title</th>
            <th>Amount</th>
            <th>Category</th>
            <th>Date</th>
            <th>Action</th>
        </tr>

        {% for expense in expenses %}
        <tr>
            <td>{{ expense["title"] }}</td>
            <td>₹{{ "%.2f"|format(expense["amount"]) }}</td>
            <td>{{ expense["category"] }}</td>
            <td>{{ expense["date"] }}</td>
            <td>
                <a class="delete"
                   href="/delete/{{ expense['id'] }}">
                    Delete
                </a>
            </td>
        </tr>
        {% endfor %}

    </table>

</div>

</body>
</html>
